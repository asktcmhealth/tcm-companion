# Must live at the REPO ROOT (Codemagic ignores it elsewhere); the React Native
# project is the mobile/ subfolder, so every workflow sets working_directory.
workflows:
  # Compiles the iOS target for the Simulator only. No code signing needed --
  # this is deliberately runnable BEFORE an Apple Developer account exists,
  # to prove whisper.rn / audio-pcm-stream / pinyin-pro etc. all compile for
  # iOS at all. It does not produce anything installable on a real device.
  ios-simulator-build:
    name: iOS Simulator build (no signing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      node: lts
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Build for iOS Simulator
        script: |
          xcodebuild build \
            -workspace ios/TCMScribeMobile.xcworkspace \
            -scheme TCMScribeMobile \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  # Builds a Release app (JS bundled inside, no Metro needed), launches it on an
  # iPhone simulator, and saves screenshots as build artifacts -- the way to SEE
  # the iOS app without owning a Mac. Release has __DEV__ off, so the dev
  # "sample text" buttons are absent and the screen shown is the real first
  # launch (speech model not downloaded yet) in light and dark mode.
  ios-simulator-screenshot:
    name: iOS Simulator run + screenshots
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      node: lts
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Build Release for iOS Simulator
        script: |
          xcodebuild build             -workspace ios/TCMScribeMobile.xcworkspace             -scheme TCMScribeMobile             -configuration Release             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             -derivedDataPath build/sim             CODE_SIGNING_ALLOWED=NO
      - name: Launch on a simulator and take screenshots
        script: |
          APP=$(find build/sim -name "TCMScribeMobile.app" -path "*Release-iphonesimulator*" | head -1)
          echo "App bundle: $APP"
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p screenshots
          xcrun simctl launch "$DEVICE" com.tcmscribemobile
          sleep 12
          xcrun simctl io "$DEVICE" screenshot screenshots/01-first-launch-light.png
          xcrun simctl ui "$DEVICE" appearance dark
          sleep 4
          xcrun simctl io "$DEVICE" screenshot screenshots/02-first-launch-dark.png
          # If the app crashed, this is where the reason shows up.
          xcrun simctl spawn "$DEVICE" log show --last 2m --predicate 'process == "TCMScribeMobile"' --style compact | tail -60 > screenshots/app-log.txt || true
    artifacts:
      - screenshots/*.png
      - screenshots/*.txt
      - mobile/screenshots/*.png
      - mobile/screenshots/*.txt

  # End-to-end test on the iOS Simulator with REAL audio (mobile/e2e/audio.m4a,
  # a read-aloud of benchmark/simulation_script.txt: no patient data). The app
  # finds Documents/autotest/plan.json, downloads the speech model, transcribes
  # the audio, and writes result.json; tools/score_e2e.js grades it.
  ios-simulator-e2e:
    name: iOS Simulator end-to-end (real audio)
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      node: lts
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Build Release for iOS Simulator
        script: |
          xcodebuild build -workspace ios/TCMScribeMobile.xcworkspace -scheme TCMScribeMobile -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO
      - name: Convert test audio to WAV
        script: |
          [ -f e2e/audio.m4a ] || { echo "mobile/e2e/audio.m4a was removed from the repo after the first end-to-end run. Add a test recording there (read-aloud of benchmark/simulation_script.txt, no patient data) before running this workflow."; exit 1; }
          afconvert -f WAVE -d LEI16@16000 -c 1 e2e/audio.m4a e2e/audio.wav
          ls -l e2e
      - name: Install app, drop test plan, run and wait for result
        script: |
          APP=$(find build/sim -name "TCMScribeMobile.app" -path "*Release-iphonesimulator*" | head -1)
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.tcmscribemobile data)
          mkdir -p "$DATA/Documents/autotest" screenshots
          cp e2e/audio.wav "$DATA/Documents/autotest/audio.wav"
          cp e2e/plan.json "$DATA/Documents/autotest/plan.json"
          xcrun simctl launch "$DEVICE" com.tcmscribemobile
          # Wait up to 40 minutes (539 MB model download + transcription).
          for n in $(seq 1 240); do
            [ -f "$DATA/Documents/autotest/result.json" ] && break
            [ $((n % 6)) -eq 0 ] && { echo "--- $((n/6)) min"; cat "$DATA/Documents/autotest/progress.log" 2>/dev/null | tail -3; }
            sleep 10
          done
          xcrun simctl io "$DEVICE" screenshot screenshots/e2e-result.png || true
          cp "$DATA/Documents/autotest/result.json" screenshots/result.json || true
          cp "$DATA/Documents/autotest/progress.log" screenshots/progress.log || true
          xcrun simctl spawn "$DEVICE" log show --last 45m --predicate 'process == "TCMScribeMobile"' --style compact | tail -80 > screenshots/app-log.txt || true
      - name: Score the result
        script: node ../tools/score_e2e.js screenshots/result.json | tee screenshots/score.txt
    artifacts:
      - screenshots/*
      - mobile/screenshots/*

  # Look at the real results screen on an iPhone simulator, without any audio or
  # speech model: the app is started with a ready-made transcript
  # (mobile/e2e/transcript.txt, a read-aloud of the public simulation script)
  # and CI screenshots it at several scroll positions, light and dark.
  ios-simulator-ui-check:
    name: iOS Simulator UI check (results screen)
    max_build_duration: 45
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      node: lts
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Build Release for iOS Simulator
        script: |
          xcodebuild build -workspace ios/TCMScribeMobile.xcworkspace -scheme TCMScribeMobile -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO
      - name: Show the results screen at several scroll positions
        script: |
          APP=$(find build/sim -name "TCMScribeMobile.app" -path "*Release-iphonesimulator*" | head -1)
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.tcmscribemobile data)
          mkdir -p "$DATA/Documents/autotest" screenshots
          shoot () {
            # $1 = scroll offset, $2 = output name
            xcrun simctl terminate "$DEVICE" com.tcmscribemobile || true
            rm -f "$DATA/Documents/autotest/result.json"
            node -e "const fs=require('fs');fs.writeFileSync(process.argv[2],JSON.stringify({transcript:fs.readFileSync('e2e/transcript.txt','utf8'),scrollY:Number(process.argv[1])}))" "$1" "$DATA/Documents/autotest/plan.json"
            xcrun simctl launch "$DEVICE" com.tcmscribemobile
            for n in $(seq 1 30); do
              [ -f "$DATA/Documents/autotest/result.json" ] && break
              sleep 1
            done
            sleep 1
            xcrun simctl io "$DEVICE" screenshot "screenshots/$2.png"
          }
          xcrun simctl ui "$DEVICE" appearance light
          shoot 0 01-top-light
          shoot 700 02-herbs-light
          shoot 1500 03-herbs-lower-light
          shoot 2600 04-more-light
          shoot 4200 05-bottom-light
          xcrun simctl ui "$DEVICE" appearance dark
          shoot 700 06-herbs-dark
          xcrun simctl spawn "$DEVICE" log show --last 10m --predicate 'process == "TCMScribeMobile"' --style compact | tail -40 > screenshots/app-log.txt || true
    artifacts:
      - screenshots/*
      - mobile/screenshots/*

  # Real-device / TestFlight build. Needs an Apple Developer account ($99/yr,
  # enrolled by the account owner -- see project notes) and an
  # app_store_connect integration configured in the Codemagic dashboard
  # before this workflow can run; it will fail without both. Left here as
  # the next step once that account exists, not something to run yet.
  ios-device-build:
    name: iOS device build (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: mobile
    integrations:
      app_store_connect: codemagic
    environment:
      node: lts
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tcmscribemobile
      vars:
        XCODE_WORKSPACE: "ios/TCMScribeMobile.xcworkspace"
        XCODE_SCHEME: "TCMScribeMobile"
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
