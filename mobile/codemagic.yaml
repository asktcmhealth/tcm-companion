workflows:
  # Compiles the iOS target for the Simulator only. No code signing needed --
  # this is deliberately runnable BEFORE an Apple Developer account exists,
  # to prove whisper.rn / audio-pcm-stream / pinyin-pro etc. all compile for
  # iOS at all. It does not produce anything installable on a real device.
  ios-simulator-build:
    name: iOS Simulator build (no signing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Build for iOS Simulator
        script: |
          xcodebuild build \
            -workspace ios/TCMScribeMobile.xcworkspace \
            -scheme TCMScribeMobile \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  # Real-device / TestFlight build. Needs an Apple Developer account ($99/yr,
  # enrolled by the account owner -- see project notes) and an
  # app_store_connect integration configured in the Codemagic dashboard
  # before this workflow can run; it will fail without both. Left here as
  # the next step once that account exists, not something to run yet.
  ios-device-build:
    name: iOS device build (TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tcmscribemobile
      vars:
        XCODE_WORKSPACE: "ios/TCMScribeMobile.xcworkspace"
        XCODE_SCHEME: "TCMScribeMobile"
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
